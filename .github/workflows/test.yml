name: Test

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system Kerberos libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libkrb5-dev

      - name: Install package
        run: python -m pip install -e .[dev]

      - name: Verify all test modules import cleanly
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); import test_api; import test_mutual_auth; print('OK')"

      - name: Run tests with coverage
        run: python -m coverage run -m unittest discover -s tests -v

      - name: Enforce 100% coverage
        run: python -m coverage report -m --fail-under=100
