name: Build

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install build tools
        run: python -m pip install build

      - name: Build source distribution and pure wheel
        run: python -m build

      - name: Fetch dependency graph SBOM (PEP 770)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${{ github.repository }}/dependency-graph/sbom \
            --jq '.sbom' > dist/httpx2_negotiate_sspi.spdx.json

      - name: Inject SBOM into wheel (PEP 770)
        run: |
          python .github/scripts/inject_sbom.py \
            dist/*.whl \
            dist/httpx2_negotiate_sspi.spdx.json

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
