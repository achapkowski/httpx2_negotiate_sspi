[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httpx2-negotiate-sspi"
dynamic = ["version"]
description = "HTTP Negotiate/Kerberos/NTLM authentication for httpx2 via pyspnego."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [
    { name = "achapkowski", email = "achapkowski@esri.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "cryptography>=50.0.0",
    "httpx2>=2.16.0,<3",
    "pyspnego>=0.12.4; platform_system == 'Windows'",
    "pyspnego[kerberos]>=0.12.4; platform_system != 'Windows'",
    "sspilib>=0.6.0; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "build",
    "coverage>=7",
]
doc = ["sphinx", "sphinx-rtd-theme"]

[project.urls]
Homepage = "https://github.com/achapkowski/httpx2_negotiate_sspi"
Documentation = "https://achapkowski.github.io/httpx2_negotiate_sspi"

[tool.setuptools.dynamic]
version = { attr = "httpx2_negotiate_sspi.__version__.__version__" }

[tool.coverage.run]
omit = [
    "tests/test_integration_iis.py",
    "tests/test_integration_kerberos.py",
    "tests/integration_server.py",
]

[tool.coverage.report]
fail_under = 100
